name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # この名前が Ruleset の必須チェック名。変えるなら Ruleset も変える。
    name: 検査
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node のバージョンは .nvmrc が正。ここに直接書かない。
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 手元と同じ検証コマンド(CLAUDE.md)。中身は .github/scripts/check.mjs にある。
      - name: 検査
        run: node .github/scripts/check.mjs
