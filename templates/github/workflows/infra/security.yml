name: Security

# 依存とインフラ定義に既知の脆弱性・設定不備が無いかを Trivy で見る。
#
# **結果を GitHub の Code Scanning(SARIF)へは送っていない。** 組織で Code Security が
# 無効なら送っても弾かれる(有効化すると committer 単位の課金が発生する)。
# 表形式でログに出し、CRITICAL / HIGH が出たらジョブを落とす方式にしてある。
# 有効化したときは、各ステップを format: sarif + github/codeql-action/upload-sarif に
# 差し替える。
#
# **このジョブは Ruleset の必須チェックに入れない。** 自分のコードの誤りではなく
# 「世の中で新しく見つかった脆弱性」で赤くなるため、マージそのものを止めると
# 身動きが取れなくなる。赤は「見て判断する合図」として扱う。
on:
  pull_request:
  push:
    branches: [master]
  # コードが変わらなくても脆弱性は増える。新しく公表されたものを週1で拾う。
  # (private リポジトリでは 60 日活動が無いと GitHub 側で自動停止される)
  schedule:
    - cron: '0 0 * * 1'   # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # **event_name を含める。** schedule / workflow_dispatch / master への push は
  # どれも github.ref が refs/heads/master になるため、これが無いと同じグループに入り、
  # 月曜の定期実行が同時刻の push に黙ってキャンセルされる。
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  scan:
    name: 脆弱性スキャン
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # package-lock.json 等の依存に既知の脆弱性が無いか。
      # ignore-unfixed: 修正版がまだ出ていないものは上げようが無いので、ここでは落とさない。
      - name: 依存の脆弱性
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # 手書きの CloudFormation テンプレート(OIDC のロール定義など)の設定不備。
      #
      # **CDK が synth する本体のテンプレートは対象にしていない。**
      # スキャンするには synth が要り、synth には CI 側のセットアップを二重に持つ
      # ことになる。また CDK の生成物は Trivy の CloudFormation ルールと相性が悪く
      # 誤検知が多い。まずは手書きのテンプレートだけを見る
      # (このリポジトリに手書きテンプレートが無ければ、このステップごと削ってよい)。
      - name: 手書き IaC の設定不備
        # **前のステップが落ちても実行する。** 既定では失敗した時点で以降が skip されるため、
        # 依存に CVE が出ている週は IaC の検査が一度も走らなくなる。
        # 見たいのは別々のものなので、毎回そろえて出す。
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: <hand-written IaC dir>
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
